name: Release

# Push a tag like v0.4.1 to build, test and package the extension, and attach
# the .vsix to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test

      # The tag must match package.json's version, or the vsix name and the
      # release name disagree.
      - name: Check version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $have"
            exit 1
          fi

      - name: Package vsix
        run: npm run package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.vsix \
            --title "$GITHUB_REF_NAME" --generate-notes
