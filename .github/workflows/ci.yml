name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      # `build` runs the type check (both tsconfigs) before bundling.
      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

      # The extension-host integration test (npm run test:integration) needs
      # a local VS Code install, so it is not run here.

      - name: Package vsix
        run: npm run package

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: vett-chat-vsix
          path: '*.vsix'
          if-no-files-found: error
